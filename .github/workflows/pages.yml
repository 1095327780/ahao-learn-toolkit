# 把 site/ 构建成静态站，发布到 GitHub Pages（www.ahaolearn.com）。
# 生效前要在仓库 Settings → Pages 里把 Source 选成 “GitHub Actions”，并把自定义域名设成 www.ahaolearn.com
# （同一个域名要先从 ahaolearn.github.io 仓库的 Pages 设置里移除）。
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
