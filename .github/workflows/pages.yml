# 把 site/ 构建成静态站，发布到 GitHub Pages（www.ahaolearn.com），同时把成品推到 site-dist 分支供 EdgeOne Pages 使用。
# 生效前要在仓库 Settings → Pages 里把 Source 选成 “GitHub Actions”，并把自定义域名设成 www.ahaolearn.com
# （同一个域名要先从 ahaolearn.github.io 仓库的 Pages 设置里移除）。
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to push the built site to the site-dist branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pip install fonttools brotli
          python3 site/build.py
      - name: Push the built site to the site-dist branch (EdgeOne Pages deploys from it, no build step there)
        # a normal fast-forward commit on top of the branch, so EdgeOne's Git integration sees an ordinary push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 --branch site-dist "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ../site-dist
          find ../site-dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. ../site-dist/
          cd ../site-dist
          git add -A
          git diff --cached --quiet && { echo "site unchanged"; exit 0; }
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q origin site-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
