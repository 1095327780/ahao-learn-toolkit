# 每次 push 后同步到国内镜像 CNB（cnb.cool）。
# 开通后在仓库 Settings 里设置：
#   Variables: CNB_REPO_URL，例如 https://cnb.cool/<组>/ahao-learn-toolkit.git
#   Secrets:   CNB_TOKEN，CNB 访问令牌
# 未设置 CNB_REPO_URL 时本任务跳过。
name: Sync mirrors
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cnb:
    if: ${{ vars.CNB_REPO_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point the README install prompt at CNB
        # the mirror's README should send people to the CNB copy (reachable in China); only the block between the markers changes
        env:
          SOURCE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CNB_URL: ${{ vars.CNB_REPO_URL }}
        run: |
          python3 - <<'PY'
          import os, re
          cnb = os.environ["CNB_URL"].removesuffix(".git")
          source = os.environ["SOURCE_REPO_URL"].removesuffix(".git")
          s = open("README.md", encoding="utf-8").read()
          s = re.sub(r"(<!-- install-prompt -->.*?<!-- /install-prompt -->)",
                     lambda m: m.group(1).replace(source, cnb), s, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(s)
          PY
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git commit -am "README: install from CNB" || true
      - name: Sync to CNB
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: ${{ vars.CNB_REPO_URL }}
          PLUGIN_AUTH_TYPE: "https"
          PLUGIN_USERNAME: "cnb"
          PLUGIN_PASSWORD: ${{ secrets.CNB_TOKEN }}
          PLUGIN_FORCE: "true"
